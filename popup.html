<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 12px;
    width: 320px;
    font: 13px/1.5 system-ui, sans-serif;
  }
  #page-title {
    margin: 0 0 8px;
    font-size: 12px;
    color: gray;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  input {
    box-sizing: border-box;
    width: 100%;
    padding: 8px;
    border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    gap: 8px;
  }
  #status { color: green; min-height: 1em; }
  button {
    padding: 6px 14px;
    border: 0;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  ol { margin: 0; padding-left: 0; list-style: none; }
  li { padding: 6px 8px; border-radius: 8px; }
  li.selected { background: color-mix(in srgb, Highlight 25%, transparent); }
  li a { color: inherit; text-decoration: none; font-weight: 500; }
  .tags { color: #2563eb; font-size: 12px; margin-left: 6px; }
  .url { color: gray; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: gray; }
  .hidden { display: none; }
  h1 { font-size: 14px; margin: 0 0 8px; }
</style>
</head>
<body>
  <div id="add-mode">
    <p id="page-title"></p>
    <input id="tags" placeholder="\u6a19\u7c64\uff1a\u4ee5\u7a7a\u767d\u5206\u9694\uff0c\u4f8b\u5982 model gear" spellcheck="false">
    <div class="row">
      <span id="status"></span>
      <button id="save">\u5132\u5b58\u66f8\u7c3d</button>
    </div>
  </div>
  <div id="search-mode" class="hidden">
    <h1>\u66f8\u7c3d\uff1a<span id="q"></span></h1>
    <ol id="list"></ol>
  </div>
  <script type="module" src="popup.js"><\/script>
</body>
</html>
